<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Handhold rigs any 3D hand or character, finds grips that hold, and exports the pose and animations to Unity, Godot and Blender. Free, open source, runs in your browser."
    />
    <title>Handhold: grips and hold animations for 3D characters</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%232f62e9'/%3E%3Cpath d='M7 16.5V10a1.5 1.5 0 0 1 3 0v3.5M10 12V7.5a1.5 1.5 0 0 1 3 0V12m0-3.5a1.5 1.5 0 0 1 3 0V13m0-2a1.5 1.5 0 0 1 3 0v3c0 3-2 5-5 5h-1c-2.2 0-3.6-1-4.6-2.6' fill='none' stroke='white' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="app">
      <header id="topbar"></header>
      <aside id="panel" aria-label="Steps"></aside>
      <main id="stage">
        <div id="viewport" aria-label="3D view"></div>
        <div id="view-toggles" role="group" aria-label="Show in the 3D view"></div>
        <p id="hint" aria-live="polite"></p>
        <div id="drop-veil" hidden><span>Drop to load</span></div>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
