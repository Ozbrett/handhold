<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Handhold's rig report: a character's skeleton, skin weights and wrists, before and after a fix, beside what the game measures in every hold." />
    <title>Handhold rig report</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%232f62e9'/%3E%3Cpath d='M7 16.5V10a1.5 1.5 0 0 1 3 0v3.5M10 12V7.5a1.5 1.5 0 0 1 3 0V12m0-3.5a1.5 1.5 0 0 1 3 0V13m0-2a1.5 1.5 0 0 1 3 0v3c0 3-2 5-5 5h-1c-2.2 0-3.6-1-4.6-2.6' fill='none' stroke='white' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="rig-app">
      <header class="rr-top">
        <a class="rr-brand" href="./">Handhold</a>
        <span class="rr-crumb">Rig report</span>
        <span class="rr-title" id="rr-title"></span>
      </header>
      <section class="rr-stage">
        <div class="rr-views" id="rr-views">
          <div class="rr-label" style="left: 0">Before</div>
          <div class="rr-label" style="left: 50%">Now</div>
          <p class="rr-loading" id="rr-loading">Loading the models…</p>
        </div>
        <div class="rr-tools" role="group" aria-label="View">
          <div class="rr-seg" id="rr-look" role="radiogroup" aria-label="Show"></div>
          <div class="rr-seg" id="rr-focus" role="radiogroup" aria-label="Look at"></div>
          <label class="rr-check"><input type="checkbox" id="rr-bones" /> Bones</label>
          <label class="rr-slider">Wrist roll <input type="range" id="rr-roll" min="-90" max="90" step="5" value="0" /><output id="rr-roll-v">0°</output></label>
          <label class="rr-slider">Wrist bend <input type="range" id="rr-bend" min="-60" max="60" step="5" value="0" /><output id="rr-bend-v">0°</output></label>
        </div>
        <p class="rr-legend" id="rr-legend"></p>
      </section>
      <section class="rr-cards" id="rr-summary" aria-label="Summary"></section>
      <section class="rr-card rr-ideal-card" id="rr-ideal"></section>
      <section class="rr-grid">
        <div class="rr-card" id="rr-rig"></div>
        <div class="rr-card" id="rr-notes"></div>
      </section>
      <section class="rr-card rr-holds" id="rr-holds"></section>
    </div>
    <script type="module" src="/src/rig/main.ts"></script>
  </body>
</html>
